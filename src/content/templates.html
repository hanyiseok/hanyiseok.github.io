    <section class="hs-detail-hero">
      <a class="hs-breadcrumb cursor-interaction" href="#research" data-page="research"><span aria-hidden="true">←</span> Research</a>
      <p class="hs-eyebrow hs-detail-type">CARBON CAPTURE · MODELING & FABRICATION</p>
      <h1>Modeling CO₂ absorption <br>in hollow-fiber contactors<span>.</span></h1>
      <p class="hs-deck">From a fabricated membrane contactor to a transport model and a simpler description of what controls absorption time.</p>
      <div class="hs-detail-facts"><div><span>Institution</span><p>Stony Brook University <br>Seo Research Group</p></div><div><span>My contribution</span><p>Design & fabrication <br>Transport modeling · NTU analysis</p></div><div><span>Research materials</span><button class="cursor-interaction" type="button" data-preview-file="HFMC full report">HFMC report <span aria-hidden="true">↗</span></button><button class="cursor-interaction" type="button" data-preview-file="NTU full report">NTU report <span aria-hidden="true">↗</span></button></div></div>
    </section>
    <div class="hs-reading-layout">
      <aside class="hs-contents" aria-label="On this page"><p>ON THIS PAGE</p><a class="cursor-interaction" href="#hs-building">Building the contactor</a><a class="cursor-interaction" href="#hs-state">Choosing the state variables</a><a class="cursor-interaction" href="#hs-ntu">A simpler description</a><a class="cursor-interaction" href="#hs-correction">Testing the approximation</a></aside>
      <article class="hs-prose">
        <section id="hs-building"><p class="hs-section-counter">01 / EXPERIMENTAL SYSTEM</p><h2>Building the contactor</h2><p>At Stony Brook, I designed and fabricated a hollow-fiber membrane contactor for CO₂ absorption into a recirculating KOH solution. Alongside the hardware, I developed a model to predict how the solution’s pH changes during absorption.</p><p>I used Fusion 360 to design components and adjusted printer settings to produce and test polypropylene parts. Decisions about sealing, tubing, and the epoxy used to secure the fibers required attention to both material properties and assembly conditions.</p></section>
        <section id="hs-state"><p class="hs-section-counter">02 / MODEL REPRESENTATION</p><h2>Choosing what to track</h2><p>A study by Hatton and colleagues drew my attention to how nondimensionalization and approximation can turn a more complex transport problem into a simpler description. In the KOH system, tracking every carbonate species separately would require several concentration fields coupled by equilibrium constraints.</p><p>I instead used two quantities familiar from water chemistry: dissolved inorganic carbon and alkalinity. Both are conserved under internal acid–base reactions. I solved for their transport and accumulation, then reconstructed carbonate speciation and pH from local equilibrium.</p><p>The radial–axial model connects species-dependent diffusion, gas-phase CO₂ depletion, and the recirculating tank balance. I examined carbon conservation and sensitivity to the grid and time step while calculating uptake and pH responses for different initial solution compositions.</p></section>
        <section id="hs-ntu"><p class="hs-section-counter">03 / REDUCED DESCRIPTION</p><h2>Finding a simpler route to absorption time</h2><p>Running the detailed model made its computational cost a practical concern. A professor suggested examining mass transfer and gas flow in a simpler model, anticipating diminishing reductions in loading time as flow increased. I developed the suggestion into a model with fixed transfer coefficients and an analysis based on the number of transfer units, or NTU.</p><p>This analysis explains why increasing the gas supply can have a limited effect when the module’s transfer capacity is the bottleneck. I then incorporated dissolved CO₂, calculated from the evolving solution composition, into the absorption driving force.</p><p>The resulting expression separates the time to a target pH into a reference absorption time and a multiplier describing the effect of changing chemical state. For the reference pH 10 target, that effect increased the predicted time from 3.120 to 3.695 hours, closer to the numerical reference of 3.724 hours.</p></section>
        <section id="hs-correction"><p class="hs-section-counter">04 / APPROXIMATION & CORRECTION</p><h2>Knowing when the approximation changes</h2><p>The time expression assigns the instantaneous tank composition to the liquid throughout the contactor. The numerical reference also accounts for composition changes during a single pass. At lower liquid flow, carbon accumulation during that pass becomes more important; discrepancies also grow as the target approaches equilibrium.</p><p>I used a first-order expansion of the material balance to derive an additional-time correction that depends on liquid flow and the remaining driving force.</p><div class="hs-result"><span>KEY RESULT</span><p>Across the 100 condition–target combinations examined, the correction reduced the absolute time discrepancy relative to the numerical reference.</p></div></section>
        <section class="hs-resources"><h2>Read the full analysis</h2><p>Governing equations, numerical checks, derivations, and quantitative comparisons are provided in the two reports.</p><div class="hs-resource-links"><button class="cursor-interaction" type="button" data-preview-file="HFMC full report"><span>HFMC modeling report<small>Full report</small></span><span aria-hidden="true">↗</span></button><button class="cursor-interaction" type="button" data-preview-file="NTU full report"><span>NTU analysis<small>Full report</small></span><span aria-hidden="true">↗</span></button></div></section>
      </article>
    </div>
    <div class="hs-next-project"><span>EXTENDING THIS FRAMEWORK</span><a class="cursor-interaction" href="#neu" data-page="neu">Carbon and isotope balances in CO₂ electrolysis<i data-lucide="chevron-right" aria-hidden="true"></i></a></div>

<template id="hanyi-arww-template">
    <section class="hs-detail-hero">
      <a class="hs-breadcrumb cursor-interaction" href="#research" data-page="research"><span aria-hidden="true">←</span> Research</a>
      <p class="hs-eyebrow hs-detail-type">WATER TREATMENT · EXPERIMENTAL RESEARCH</p>
      <h1>Treating amine-rich <br>model wastewater<span>.</span></h1>
      <p class="hs-deck">Connecting electrochemical treatment and adsorption with practical choices about materials, cost, and operating conditions.</p>
      <div class="hs-detail-facts"><div><span>Institution</span><p>University of Seoul <br>Water Environment and Engineering Lab</p></div><div><span>My contribution</span><p>Batch-system design & operation <br>Condition comparison · Interpretation</p></div><div><span>Research materials</span><button class="cursor-interaction" type="button" data-preview-file="ARWW project brief">Project brief <span aria-hidden="true">↗</span></button></div></div>
    </section>
    <div class="hs-reading-layout">
      <aside class="hs-contents" aria-label="On this page"><p>ON THIS PAGE</p><a class="cursor-interaction" href="#hs-arww-context">The process context</a><a class="cursor-interaction" href="#hs-arww-choices">Choosing conditions</a><a class="cursor-interaction" href="#hs-arww-pathways">Following the nitrogen</a></aside>
      <article class="hs-prose">
        <section id="hs-arww-context"><p class="hs-section-counter">01 / CONTEXT & EXPERIMENT</p><h2>When one process creates another treatment problem</h2><p>At the University of Seoul, I designed and operated a batch system for treating amine-rich model wastewater. The project considered treatment of amine waste from carbon capture, with potential application to the Yongin semiconductor cluster in mind. My experiments used synthetic wastewater prepared with monoethanolamine (MEA).</p><p>For me, this connected water treatment to the operation of another environmental process. The reactor combined electrochemical oxidation and coagulation with granular activated carbon adsorption. I compared concentration changes while varying electrode material and spacing, voltage, carbon dosage, initial MEA concentration, and temperature.</p></section>
        <section id="hs-arww-choices"><p class="hs-section-counter">02 / EXPERIMENTAL DECISIONS</p><h2>Choosing conditions beyond removal alone</h2><p>I considered treatment performance alongside electrode cost and properties reported in the literature. In the initial screening, stainless steel produced the largest reduction in MEA concentration, while aluminum gave a nearby value.</p><div class="hs-result"><span>A PRACTICAL CHOICE</span><p>Considering both performance and cost, I selected aluminum for the follow-up experiments.</p></div><p>The condition comparisons and follow-up work led me to identify electrode material, activated carbon dosage, and temperature as important factors in operating guidance within the tested range.</p></section>
        <section id="hs-arww-pathways"><p class="hs-section-counter">03 / INTERPRETATION & NEXT QUESTIONS</p><h2>What does a falling concentration mean?</h2><p>I also wanted to understand the transformations and transfers behind the concentration decrease. Ammonium was detected, while nitrate was not. Together with the alkaline conditions and literature, these observations supported consideration of oxidation, ammonia release, and capture through coagulation or adsorption as possible pathways.</p><p>I did not directly track all degradation products or material transferred to the gas and solid phases, so the actual pathways remained unresolved. A semiconductor-process visit also exposed me to how wastewater composition varies between manufacturing steps.</p><p>These experiences sharpened my interest in how treatment and recovery should depend on a stream’s origin and composition: which chemical forms are present, where they move, and whether useful components might be selectively collected for reuse.</p></section>
        <section class="hs-resources"><h2>Explore the experimental evidence</h2><p>The project brief includes operating conditions, electrode comparisons, and the scope of the nitrogen-species interpretation.</p><div class="hs-resource-links"><button class="cursor-interaction" type="button" data-preview-file="ARWW project brief"><span>Amine wastewater project brief<small>Project brief</small></span><span aria-hidden="true">↗</span></button></div></section>
      </article>
    </div>

<template id="hanyi-neu-template">
    <section class="hs-detail-hero"><a class="hs-breadcrumb cursor-interaction" href="#research" data-page="research"><span aria-hidden="true">←</span> Research</a><p class="hs-eyebrow hs-detail-type">CO₂ ELECTROLYSIS · MODELING & INFERENCE</p><h1>Following carbon through <br>an electrochemical reactor<span>.</span></h1><p class="hs-deck">Using carbon and isotope balances to ask what existing observations can reveal—and which measurements would be needed next.</p><div class="hs-detail-facts"><div><span>Institution</span><p>Northeastern University</p></div><div><span>My contribution</span><p>Balance modeling · Data analysis <br>Measurement design · Estimation</p></div><div><span>Research materials</span><button class="cursor-interaction" type="button" data-preview-file="NEU project brief">Project brief <span aria-hidden="true">↗</span></button></div></div></section>
    <div class="hs-reading-layout"><aside class="hs-contents" aria-label="On this page"><p>ON THIS PAGE</p><a class="cursor-interaction" href="#hs-neu-model">The modeling question</a><a class="cursor-interaction" href="#hs-neu-data">Existing observations</a><a class="cursor-interaction" href="#hs-neu-estimation">Testing inference</a></aside><article class="hs-prose">
      <section id="hs-neu-model"><p class="hs-section-counter">01 / MODELING QUESTION</p><h2>Extending a framework from absorption to electrolysis</h2><p>I extended the dissolved inorganic carbon and alkalinity framework from my HFMC research to model ¹³C enrichment in unreacted CO₂ during electrolysis. Because DIC excludes carbon in electrolysis products, I added product inventories across gas and liquid compartments.</p><p>Total carbon alone cannot determine isotopic composition. Isotope-specific balances and transfer calculations let me track changes even when opposing isotope fluxes canceled in the total carbon flux.</p><p>Alongside building the model, I asked how far agreement with observations could support a physical interpretation. A model that reproduces observations can still leave several explanations compatible with the data.</p></section>
      <section id="hs-neu-data"><p class="hs-section-counter">02 / DATA & MEASUREMENT</p><h2>Turning an uncertain interpretation into a measurement</h2><p>I analyzed archived zero-current bubbling data and separately examined published anode-gas observations. In the anode-gas analysis, changing the assumed oxygen-evolution efficiency from 100% to 95% gave similar fits but different estimates of an effective parameter describing bicarbonate and carbonate’s shares of current.</p><p>I proposed comparing evolved oxygen with integrated charge to test that efficiency assumption, and liquid carbon inventories with anode gas release to examine membrane transfer. These were proposed follow-up measurements, separate from the existing datasets I analyzed.</p></section>
      <section id="hs-neu-estimation"><p class="hs-section-counter">03 / SYNTHETIC-DATA ESTIMATION</p><h2>Testing what could be recovered</h2><p>I implemented eight estimation procedures and examined parameter recovery using synthetic data. Some prescribed quantities could be recovered, while current-partition weights remained substantially uncertain.</p><div class="hs-result"><span>RESEARCH TAKEAWAY</span><p>Fitting observable outputs and distinguishing internal carbon pathways are different tasks. The measurement design has to address both.</p></div></section>

<template id="hanyi-about-template">
    <section class="hs-index hs-about">
      <p class="hs-eyebrow">ABOUT</p><h1>A path into research<span>.</span></h1>
      <div class="hs-about-story">
        <p>When my five-year-old sibling said we needed masks because of fine particulate pollution, I realized how deeply environmental problems shape everyday choices. Caring for the environment is also an expression of my faith: I want the world God created to remain beautiful. I began studying environmental engineering at the University of Seoul with a desire to contribute through engineering.</p>
        <p>As my interest in sustainability grew, I wanted to understand its technologies and processes more deeply and develop that interest through research. I continued my studies at Stony Brook through the dual-degree program.</p>
        <p>Studying AI led me to explore its mathematical and statistical foundations. I also found pleasure in expressing a phenomenon mathematically and understanding the relationships within it. These interests led me to pursue Applied Mathematics and Statistics as a second major.</p>
        <p>In research, I enjoy seeing a familiar concept explain a new phenomenon—and turning a design decision into a physical device. Moving between models and things I can build makes me want to keep asking questions, pursue them in depth, and let each finding shape what I study next.</p>
        <p>In the long term, I hope to found a company that carries environmental research into practical processes. I want to stay involved as an idea moves from a laboratory result toward operation and commercialization.</p>
